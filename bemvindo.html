<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./funcoes.js" defer></script>
</head>
<body class="dashboard_body">
    <header>
        <h2>Sistema Hidráulica Pro</h2>
        <a href="bombas.html">Sair</a>
    </header>
    <main>
        <nav>
            <button class="btn_dash">Bem vindo</button>
            <button class="btn_dash">Consultar Produto</button>
        </nav>
        <div class="display_dashboard_main">
            <div class="mensagem">
                <h1>Bem vindo</h1>
                <p>Escolha uma opção no menu lateral</p>
            </div>
            <div class="pesquisar_bombas">
                <h1>Pesquisar</h1>
                <form class="buscarbombas" action="">
                    <label for="">Pesquisar Bomba por ID</label>
                    <input type="number" id="idBomba"/>
                    <button type="submit">Pesquisar</button>
                </form>
                <img id="imgBomba" src="" alt="Bomba (hidraulica)">
                <p id="nomeBomba"></p>
                <p id="precoBomba"></p>
            </div>
        </div>
    </main>
    
</body>
</html>
